<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Antariks System</title>
    
    <!-- Konfigurasi URL Tujuan (Ganti di sini) -->
    <script>
        const destinationURL = "https://jivimuz.my.id"; 
    </script>

    <!-- Meta Refresh untuk Backup (Jika JS non-aktif/lambat) -->
    <meta http-equiv="refresh" content="0;url=https://jivimuz.my.id">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi Background Drift */
        @keyframes drift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient {
            background: linear-gradient(-45deg, #020617, #1e293b, #0f172a, #172554);
            background-size: 400% 400%;
            animation: drift 10s ease infinite;
        }

        /* Animasi Spinner Cepat */
        @keyframes spin-fast {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner-fast {
            animation: spin-fast 0.8s linear infinite;
        }
    </style>
</head>
<body class="animate-gradient text-white h-screen flex items-center justify-center font-sans overflow-hidden">

    <!-- Main Container -->
    <div class="relative z-10 flex flex-col items-center justify-center">
        
        <!-- Visual Spinner Effect -->
        <div class="relative w-24 h-24 mb-8">
            <!-- Outer Glow -->
            <div class="absolute inset-0 bg-cyan-500/30 blur-xl rounded-full animate-pulse"></div>
            
            <!-- Rotating Rings -->
            <svg class="absolute inset-0 w-full h-full text-cyan-500 spinner-fast" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            
            <!-- Center Icon -->
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-8 h-8 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                </svg>
            </div>
        </div>

        <!-- Text Status -->
        <h1 class="text-3xl font-bold tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-200 to-blue-400">
            Redirecting
        </h1>
        <p class="text-slate-400 text-sm animate-pulse">Jivimuz connection security established...</p>

        <!-- Fallback Link (Hanya muncul jika redirect gagal total) -->
        <div class="mt-8 opacity-50 hover:opacity-100 transition-opacity">
            <a href="https://jivimuz.my.id" id="manual-link" class="text-xs text-slate-500 border-b border-slate-700 pb-0.5 hover:text-cyan-400 hover:border-cyan-400">
                Click here if not redirected
            </a>
        </div>

    </div>

    <script>
        // LOGIC REDIRECT INSTAN
        // Langsung eksekusi saat script di-parse
        
        // 1. Update link manual (untuk jaga-jaga)
        document.getElementById('manual-link').href = destinationURL;
        
        // 2. Update meta tag secara dinamis (double safety)
        const meta = document.querySelector('meta[http-equiv="refresh"]');
        if (meta) {
            meta.setAttribute('content', '0;url=' + destinationURL);
        }

        // 3. Redirect JavaScript Utama (Paling Cepat)
        // Menggunakan .replace() agar tombol 'Back' browser tidak terjebak loop di halaman ini
        window.location.replace(destinationURL);
    </script>
</body>
</html>
